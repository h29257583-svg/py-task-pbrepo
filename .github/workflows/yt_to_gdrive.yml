name: YT VOD to Google Drive

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube Video URL'
        required: true
        type: string
      folder:
        description: 'Google Drive Folder Name'
        required: false
        default: 'SavedVideos'
        type: string

jobs:
  download_and_upload:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install rclone and test Google Drive first
        env:
          RCLONE_CONFIG_VAL: ${{ secrets.RCLONE_CONFIG }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone jq curl
          python3 fix_rclone.py
          REMOTE=$(rclone listremotes | head -n 1)
          echo "Using remote: $REMOTE"
          rclone about "$REMOTE" || echo "About check complete"

      - name: Start bgutil PO-Token server
        run: |
          docker run -d --name bgutil-ytdlp-pot-provider -p 4416:4416 brainicism/bgutil-ytdlp-pot-provider:latest || true
          sleep 3

      - name: Install Deno, ffmpeg, yt-dlp and WARP
        run: |
          sudo apt-get install -y -qq ffmpeg unzip gnupg lsb-release
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          python3 -m pip install -U yt-dlp bgutil-ytdlp-pot-provider curl_cffi
          
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp || true
          sudo systemctl start warp-svc || true
          sleep 2
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 3

      - name: Download Video
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          VIDEO_URL: ${{ github.event.inputs.url }}
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          mkdir -p out
          
          COOKIE_ARGS=()
          if [ -n "$YT_COOKIES" ]; then
            printf "%s
" "$YT_COOKIES" | sed '1s/^ï»¿//' > /tmp/cookies.txt
            COOKIE_ARGS=(--cookies /tmp/cookies.txt)
          fi
          
          PROXY_ARGS=()
          if curl -s --max-time 8 --proxy socks5h://127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace | grep -q "warp=on"; then
            echo "WARP proxy is ACTIVE"
            PROXY_ARGS=(--proxy socks5h://127.0.0.1:40000)
          fi
          
          FMT="bestvideo[height=1080][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height=1080]+bestaudio/bestvideo[height=720][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height=720]+bestaudio/bestvideo[height<=1080]+bestaudio/best[height<=1080]/best"
          COMMON=(
            --no-playlist
            --js-runtimes deno
            --remote-components ejs:github
            --concurrent-fragments 8
            --retries 10
            --fragment-retries 10
            --merge-output-format mp4
            -f "$FMT"
            -o "out/%(title).80s [%(id)s].%(ext)s"
          )
          
          SUCCESS=0
          if [ ${#COOKIE_ARGS[@]} -gt 0 ]; then
            echo "=== Attempt 1: With cookies and WARP ==="
            if yt-dlp "${PROXY_ARGS[@]}" "${COOKIE_ARGS[@]}" "${COMMON[@]}" "$VIDEO_URL"; then
              SUCCESS=1
            fi
          fi
          
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 2: Cookie-free with WARP ==="
            if yt-dlp "${PROXY_ARGS[@]}" "${COMMON[@]}" "$VIDEO_URL"; then
              SUCCESS=1
            fi
          fi
          
          if [ $SUCCESS -eq 0 ]; then
            echo "=== Attempt 3: Direct (iOS/Android/mweb) ==="
            if yt-dlp "${COMMON[@]}" --extractor-args "youtube:player_client=android,ios,mweb" "$VIDEO_URL"; then
              SUCCESS=1
            fi
          fi
          
          rm -f /tmp/cookies.txt
          
          echo "=== Check downloaded files in out/ ==="
          ls -lh out/
          
          FILE_COUNT=$(find out -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No video files downloaded! Failing step."
            exit 1
          fi

      - name: Upload to Google Drive via rclone
        env:
          GDRIVE_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          REMOTE=$(rclone listremotes | head -n 1)
          echo "Starting rclone copy to ${REMOTE}${GDRIVE_FOLDER}/"
          rclone copy out/ "${REMOTE}${GDRIVE_FOLDER}/" --drive-chunk-size 64M --stats 20s -v
          echo "=== Uploaded files in ${REMOTE}${GDRIVE_FOLDER}/ ==="
          rclone ls "${REMOTE}${GDRIVE_FOLDER}/"
          rm -f ~/.config/rclone/rclone.conf
