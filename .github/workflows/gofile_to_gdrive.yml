name: Gofile to Google Drive

on:
  workflow_dispatch:
    inputs:
      gofile_id:
        description: 'Gofile ID (e.g. a3mHj66X)'
        required: true
        type: string
      folder:
        description: 'Google Drive Folder Name'
        required: false
        default: 'SavedVideos'
        type: string

jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install rclone and jq
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq curl rclone

      - name: Download from Gofile
        env:
          GOFILE_ID: ${{ github.event.inputs.gofile_id }}
        run: |
          mkdir -p out
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          TOKEN=$(curl -sS -A "$UA" -X POST "https://api.gofile.io/accounts" | jq -r '.data.token // empty')
          WT=$(curl -sS -A "$UA" "https://gofile.io/dist/js/config.js" | grep -oE 'wt["'\'']?[[:space:]]*[:=][[:space:]]*["'\''][A-Za-z0-9]+' | grep -oE '[A-Za-z0-9]+$' | head -n 1 || true)
          [ -z "$WT" ] && WT="4fd6sg89d7s6"
          echo "Using WT=$WT"
          META=$(curl -sS -A "$UA" -H "Authorization: Bearer $TOKEN" -H "X-Website-Token: $WT" "https://api.gofile.io/contents/${GOFILE_ID}")
          LINK=$(echo "$META" | jq -r '(.data.children // {}) | to_entries[0].value.link // empty')
          NAME=$(echo "$META" | jq -r '(.data.children // {}) | to_entries[0].value.name // empty')
          echo "File: $NAME"
          if [ -z "$LINK" ]; then
            echo "Gofile API response: $META"
            exit 1
          fi
          curl -L --fail --retry 3 -A "$UA" -H "Cookie: accountToken=$TOKEN" -o "out/$NAME" "$LINK"
          ls -lh out/

      - name: Upload to Google Drive via rclone
        env:
          RCLONE_CONFIG_VAL: ${{ secrets.RCLONE_CONFIG }}
          GDRIVE_FOLDER: ${{ github.event.inputs.folder }}
        run: |
          mkdir -p ~/.config/rclone
          if printf "%s" "$RCLONE_CONFIG_VAL" | grep -q '^\[.*\]'; then
            printf "%s\n" "$RCLONE_CONFIG_VAL" > ~/.config/rclone/rclone.conf
          else
            printf "%s" "$RCLONE_CONFIG_VAL" | base64 -d > ~/.config/rclone/rclone.conf
          fi
          REMOTE=$(rclone listremotes | head -n 1)
          echo "Using remote: $REMOTE"
          [ -n "$REMOTE" ] || { echo "No rclone remote found!"; exit 1; }
          rclone copy out/ "${REMOTE}${GDRIVE_FOLDER}/" --drive-chunk-size 64M --stats 15s -v
          echo "=== Uploaded files in ${REMOTE}${GDRIVE_FOLDER}/ ==="
          rclone ls "${REMOTE}${GDRIVE_FOLDER}/"
          rm -f ~/.config/rclone/rclone.conf
